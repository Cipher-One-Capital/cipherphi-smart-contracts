# The checks that every pull request has to pass.
#
# Every action is pinned to a full commit SHA, with its tag as a trailing comment.
# Every toolchain and tool is pinned to an exact version.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Tests every refusal and the solvency invariant across seeded runs.
      - run: cargo test --locked

  # A short smoke run on every pull request. The long runs live in fuzz-nightly.yml.
  fuzz:
    name: Fuzz (contribute, distribute)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUZZ_SECONDS: 120
    defaults:
      run:
        working-directory: contracts/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: nightly-2026-11-01
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/fuzz
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo fuzz run --sanitizer none contribute -- -max_total_time=$FUZZ_SECONDS -timeout=30
      - run: cargo fuzz run --sanitizer none distribute -- -max_total_time=$FUZZ_SECONDS -timeout=30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: contracts/fuzz/artifacts

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bash ops/scripts/build.sh
      - run: node ops/scripts/check-no-upgrade.mjs
      # Fails when a Wasm built here does not hash to the value published in the
      # README's Testnet table, or when the two sets of contract names differ.
      - name: Compare Wasm hashes with the README
        run: |
          set -euo pipefail
          published="$(awk -F'|' '
            /^## / { in_testnet = ($0 == "## Testnet") }
            in_testnet && NF >= 5 && $2 ~ /`[a-z_]+`/ {
              name = $2; hash = $4
              gsub(/[ `]/, "", name); gsub(/[ `]/, "", hash)
              if (length(hash) == 64 && hash ~ /^[0-9a-f]+$/) print name, hash
            }' README.md | sort)"
          built="$(cd ops/out && for f in *.wasm; do echo "${f%.wasm} $(sha256sum "$f" | cut -d' ' -f1)"; done | sort)"
          echo "Published in README.md:"; echo "$published"
          echo "Built in ops/out:";       echo "$built"
          if [ -z "$published" ]; then
            echo "::error file=README.md::No Wasm hashes found in the Testnet table"
            exit 1
          fi
          if [ "$published" != "$built" ]; then
            echo "::error::Built Wasm hashes differ from the ones published in README.md"
            diff <(echo "$published") <(echo "$built") || true
            exit 1
          fi
          echo "All built Wasm hashes match README.md."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wasm
          path: ops/out

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
        working-directory: contracts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt in the v8.30.1 release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A fetch depth that pulls the whole history, not only the tip.
          fetch-depth: 0
      - run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          (cd "$RUNNER_TEMP" && echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
