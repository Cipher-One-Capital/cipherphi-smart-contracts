# Fuzzes each target for 30 minutes once a day.
# The corpus is carried from run to run through the Actions cache, so every run starts
# where the last one stopped.
name: Fuzz (nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [contribute, distribute]
    env:
      FUZZ_SECONDS: 1800
    defaults:
      run:
        working-directory: contracts/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: nightly-2026-11-01
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/fuzz
          key: ${{ matrix.target }}
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for ${{ env.FUZZ_SECONDS }} s
        run: cargo fuzz run --sanitizer none ${{ matrix.target }} -- -max_total_time=$FUZZ_SECONDS -timeout=30
      # Shrinks the corpus to the inputs that add coverage, so the cache stays small.
      - name: Minimise corpus
        if: always()
        continue-on-error: true
        run: cargo fuzz cmin --sanitizer none ${{ matrix.target }}
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: contracts/fuzz/artifacts/${{ matrix.target }}
