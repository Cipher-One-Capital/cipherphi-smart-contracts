# The pinned build toolchain in SEP-58 vocabulary, used to give build.sh,
# make-source-archive.sh and CI a single source of truth.
#
# The build image, recorded in each Wasm as SEP-58 `bldimg`, that names an explicit registry
# host and the single-arch digest of the linux/amd64 member of the
# 27.1.0-rust1.97.1-slim-trixie list. A multi-arch list digest resolves to a different image
# per host architecture. This names a single-arch digest to keep the recorded image the same
# on every host. Rustc, cargo and the wasm32v1-none target are bundled in the image, so they
# can all be pinned by this one digest.
BLDIMG="docker.io/stellar/stellar-cli@sha256:7040ab64bb977006c2b7466fc5face9a1ef317a53e494564d7d6ddb083cd032a"
BLDIMG_TAG="stellar/stellar-cli:27.1.0-rust1.97.1-slim-trixie (linux/amd64)"
BUILD_PLATFORM="linux/amd64"

# The flags that are passed verbatim to `stellar contract build` and recorded in each Wasm.
# This passes --locked to keep cargo from re-resolving against the registry.
BLDOPT=(--locked)

# The source archive that holds the whole workspace and feeds the one build of both Wasm files.
# This shares one archive and one build to give both Wasm files the same source_sha256.
# The archive is not committed and can only be regenerated via make-source-archive.sh,
# which gives identical bytes from any commit.
SOURCE_PREFIX="cipherphi-contracts-0.1.0"
SOURCE_ARCHIVE="sources/cipherphi-contracts-0.1.0.tar"

WASM_NAMES=(zakat_pool.wasm policy.wasm)
